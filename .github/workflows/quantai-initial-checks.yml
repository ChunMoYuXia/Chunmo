name: QuantAI initial source checks
on:
  push:
    paths: ['QuantAI/**', '.github/workflows/quantai-initial-checks.yml']
  pull_request:
    paths: ['QuantAI/**', '.github/workflows/quantai-initial-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: QuantAI
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: QuantAI/apps/client/package-lock.json
      - name: Install project dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r apps/api/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --no-deps -e apps/api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix apps/client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/client exec -- playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source and browser flow without packaging
        run: ./scripts/check.ps1
