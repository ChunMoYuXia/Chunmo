[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stock-portfolio-client-api"
version = "0.1.0"
description = "Reproducible local portfolio research and paper trading"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "httpx>=0.28,<1",
  "pypinyin>=0.53,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pytest-cov>=6,<8", "httpx2>=2,<3"]

build = ["pyinstaller==6.22.3"]

[project.scripts]
portfolio-client-api = "portfolio_client.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["portfolio_client"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "pypinyin.*"]
ignore_missing_imports = true
