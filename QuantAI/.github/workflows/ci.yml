name: Local client checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Install isolated dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r apps/api/requirements.lock
          .venv/Scripts/python -m pip install --no-deps -e apps/api
          npm ci --prefix apps/client
          npm --prefix apps/client exec -- playwright install chromium
      - name: Verify source and browser flow
        shell: pwsh
        run: ./scripts/check.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-diagnostics
          path: |
            apps/client/playwright-report
            apps/client/test-results
          retention-days: 7
