# 越塔送死的单因素短测：仅将死亡惩罚从 -2 调整到 -4。
# 对照组仍使用 reward_events.yaml；两组均从同一更新 24 权重 init-from。
train:
  save_interval_steps: 4
  eval_interval_steps: 4
  eval_episodes: 80
ppo:
  grad_clip_mode: separate
action:
  rule: targeted_attack_v1
  targeted_attack_hero_ids: [112, 133, 169]
reward:
  money: 0.0
  hp: 0.0
  economy_diff: 0.5
  damage_dealt: 1.0
  damage_taken: -0.75
  last_hit: 0.02
  win_speed: 3.0
  exp: 0.0
  ep: 0.0
  kill: 2.0
  dead: -4.0
  tower: 10.0
  win: 50.0
  lose: -50.0
