# 所有已核实的过程信号；与 targeted_attack.yaml 保持相同 PPO 和动作规则。
train:
  eval_interval_steps: 20
  eval_episodes: 40
ppo:
  grad_clip_mode: separate
action:
  rule: targeted_attack_v1
  targeted_attack_hero_ids: [112, 133, 169]
reward:
  money: 0.0
  hp: 0.0
  economy_diff: 0.5
  damage_dealt: 1.0
  damage_taken: -0.75
  last_hit: 0.02  # SDK 按步净补刀 credits，不能解释为完整个人补刀次数
  win_speed: 3.0  # 仅真实获胜，按游戏帧剩余比例发一次
  exp: 0.0
  ep: 0.0
  kill: 2.0
  dead: -2.0
  tower: 10.0
  win: 50.0
  lose: -50.0
