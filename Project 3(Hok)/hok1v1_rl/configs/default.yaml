# 随机英雄实战基线。run 会冻结实际配置；请一次只改变少量参数做对照。
hardware:
  vram_total_gb: 12.0
  vram_warn_gb: 9.0
  vram_degrade_gb: 10.5
  vram_oom_gb: 11.5
  ram_total_gb: 32.0

train:
  seed: 42
  log_dir: ./runs
  tb_log_dir: ./runs/tb
  wandb_project: hok1v1_rl
  wandb_enabled: false
  log_interval_steps: 1
  save_interval_steps: 20
  eval_interval_steps: 50
  eval_episodes: 40  # 20 个己方英雄 × 双方，每个英雄只面对一个对手；用于看趋势
  dashboard_port: 8600

env:
  num_envs: 1  # 每进程一个 native Interface；多进程使用 --samplers 2
  player_num: 2
  runtime_id: hok1v1rl-train
  gamecore_server_addr: 127.0.0.1:23432
  ai_server_addr: 127.0.0.1  # Windows gamecore 必须能回连此地址
  zmq_port_begin: 35150  # 占用两个连续端口
  gamecore_req_timeout: 3000
  max_frame_num: 20000
  predict_frequency: 3
  use_common_ai_opponent: true
  reward_time_coef: 0.0
  # 默认保留官方身份编码支持的全部 20 个英雄，不缩成单英雄任务。
  hero_ids: [112,121,123,131,132,133,140,141,146,150,154,157,163,169,175,182,193,199,502,513]
  opponent_hero_ids: [112,121,123,131,132,133,140,141,146,150,154,157,163,169,175,182,193,199,502,513]
  max_decisions: 0  # 0=完整比赛；非零只用于调试，不适合正式训练

network:
  feature_dim: 725  # 705 原始特征 + 20 我方英雄身份
  use_hero_identity: true
  legal_action_dim: 84
  lstm_hidden: 512
  lstm_time_steps: 16  # 反传序列长度，不等于奖励的折扣视野
  label_size_list: [12,16,16,16,16,8]
  target_embed_dim: 32

ppo:
  gamma: 0.999
  lamda: 0.95
  clip_param: 0.2
  entropy_beta_start: 0.01
  entropy_beta_end: 0.01
  value_coef: 0.5
  value_clip: false
  lr: 0.0001
  lr_end: 0.0001  # 与 lr 相同，避免短测预算把学习率衰减到零
  ppo_epochs: 2
  minibatch_size: 2048  # 按决策数配置，实际按完整 LSTM chunk 分批
  batch_size: 8192  # 至少收集这么多真实决策，不含 padding
  kl_target: 0.015  # 下一次优化前超限则停止整个 update
  max_grad_norm: 0.5
  grad_clip_mode: global  # 保留原基线；修复实验见 recovery_clip.yaml

reward:
  money: 0.5  # 累计收入增量 / 1000，使用 moneyCnt
  exp: 0.0  # 当前经验会回绕，暂时关闭
  hp: 1.0  # 造成/受到的净伤害，按我方最大生命归一化
  ep: 0.0  # 暂不支持此项
  kill: 2.0
  dead: -2.0
  tower: 10.0  # 建筑净掉血 / 12000
  last_hit: 0.0  # SDK 原始向量中的净补刀事件；不是我方累计补刀数
  win: 50.0
  lose: -50.0
  economy_diff: 0.0
  damage_dealt: 0.0
  damage_taken: 0.0
  win_speed: 0.0

evaluation:
  seed: 20261010
  goal_win_rate: 0.9
  final_episodes: 800  # 20×20 英雄配对 × 双方，需完整评估

action:
  rule: sdk
  targeted_attack_hero_ids: [112, 133, 169]
